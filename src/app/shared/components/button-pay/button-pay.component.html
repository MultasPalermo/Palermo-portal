<button class="mp-button" [disabled]="loading" (click)="pay()">
  <ng-container *ngIf="!loading; else load">
    {{ multaId ? 'Pagar multa' : 'Pagar acuerdo' }}
  </ng-container>
</button>

<ng-template #load>
  <span class="mp-loading">Procesando…</span>
</ng-template>

<p class="mp-error" *ngIf="error">{{ error }}</p>
